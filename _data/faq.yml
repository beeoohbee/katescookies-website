- q: How far ahead do I need to order?
  a: Please order at least 48 hours ahead. Large event orders need 1–2 weeks.
- q: Do you deliver?
  a: Yes — free local delivery on orders of 3 dozen or more within our service area. Otherwise, pickup is available from our home by appointment.
- q: How do I pay?
  a: Cash, Venmo, or Zelle at pickup or delivery. Large custom orders require a 50% deposit.
- q: Can I mix flavors in a dozen?
  a: Yes! Add the flavors to your cart and mention the mix you'd like in the order notes.
- q: Do you have allergy-friendly options?
  a: Ask us! We can sometimes make gluten-free or dairy-free versions, but all cookies are made in a home kitchen that handles common allergens, so we can't guarantee they're allergen-free.
- q: How should I store my cookies?
  a: In an airtight container at room temperature for up to 5 days, or freeze for up to 3 months.
