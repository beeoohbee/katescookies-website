# The menu. Each cookie needs a name, description, and price.
# Optional fields:
#   featured: true   -> shows on the home page
#   tags: [...]      -> small labels like "vegan" or "gluten-free"
#   dough / chips    -> colors for the cookie illustration (CSS colors)
#   image            -> path to a photo in assets/images (replaces the illustration)
#   price_note       -> short note shown after the price (e.g. "starting price")
#   fine_print       -> small allergy note under the description (e.g. "May contain nuts.")
# price is the number of dollars per dozen (used for cart totals).
- category: Classics
  items:
    - name: Chocolate Chip
      description: Golden, buttery dough loaded with dark chocolate and a sprinkle of flaky sea salt.
      price: 18
      featured: true
      dough: "#c98a4b"
      chips: "#4a2a17"
